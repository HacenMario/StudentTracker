<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طلبات الغياب</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <button onclick="goBack()" class="btn-back">
                <i class="fas fa-arrow-right"></i> العودة
            </button>
            <h1><i class="fas fa-calendar-alt"></i> طلبات عذر الغياب</h1>
            <div>
                <span id="pendingCount" class="badge">0</span> طلبات معلقة
            </div>
        </div>

        <!-- الفلاتر -->
        <div class="filter-section">
            <select id="filterStatus" onchange="loadAbsences()">
                <option value="all">كل الطلبات</option>
                <option value="pending">معلقة</option>
                <option value="approved">مقبولة</option>
                <option value="rejected">مرفوضة</option>
            </select>
            <select id="filterStudent" onchange="loadAbsences()">
                <option value="all">كل التلاميذ</option>
                <!-- سيتم تعبئته -->
            </select>
        </div>

        <!-- جدول الطلبات -->
        <div class="table-container">
            <table id="absencesTable">
                <thead>
                    <tr>
                        <th>التلميذ</th>
                        <th>الفصل</th>
                        <th>التاريخ</th>
                        <th>السبب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="absencesBody">
                    <!-- سيتم تعبئته -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/absences.js"></script>
</body>
</html>
